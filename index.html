<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download & Script Executor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #00e676;
        }
        .btn-download {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .btn-download:hover {
            background-color: #0056b3;
        }
        .script-box {
            background-color: #0d0d0d;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            position: relative;
            text-align: left;
        }
        code {
            color: #00e676;
            word-break: break-all;
            font-family: monospace;
            display: block;
            margin-bottom: 10px;
        }
        .btn-copy {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .btn-copy:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Delta & Script Hub</h2>

    <!-- Tombol Download APK -->
    <a href="https://www.mediafire.com/file/998jpyfk89hwrj8/Delta-2.736.1408-02.apk/file" target="_blank" class="btn-download">
        Download Delta APK
    </a>

    <!-- Area Copy Paste Script -->
    <div class="script-box">
        <code id="luaScript">loadstring(game:HttpGet("https://raw.githubusercontent.com/joustingmatch/Ouroboros/main/loader.lua"))()</code>
        <button class="btn-copy" onclick="copyScript()">Copy Script</button>
    </div>
</div>

<script>
    function copyScript() {
        const scriptText = document.getElementById("luaScript").innerText;
        navigator.clipboard.writeText(scriptText).then(() => {
            alert("Skrip berhasil disalin!");
        }).catch(err => {
            console.error("Gagal menyalin: ", err);
        });
    }
</script>

</body>
</html>
