<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta APK & Script</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin-bottom: 20px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .script-box {
            background-color: #090d16;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 70px;
            background: transparent;
            color: #38bdf8;
            border: none;
            resize: none;
            font-family: monospace;
            font-size: 11px;
            outline: none;
            box-sizing: border-box;
            word-break: break-all;
        }
        .btn-copy {
            width: 100%;
            margin-top: 10px;
            padding: 10px 0;
            background-color: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Delta APK &amp; Script</h2>
    
    <!-- Link Download -->
    <a href="https://www.mediafire.com/file/dq20cidv8ykr3bu/Delta-2.735.1138.apk/file" target="_blank" rel="noopener noreferrer" class="btn-download">
        Download Delta APK
    </a>

    <!-- Area Script -->
    <div class="script-box">
        <textarea id="luaScript" readonly>loadstring(game:HttpGet("https://raw.githubusercontent.com/flazhy/QuantumOnyx/refs/heads/main/QuantumOnyx.lua"))()</textarea>
        <button class="btn-copy" id="copyBtn" onclick="copyText()">Salin Script</button>
    </div>
</div>

<script>
    function copyText() {
        var textArea = document.getElementById("luaScript");
        navigator.clipboard.writeText(textArea.value).then(function() {
            var btn = document.getElementById("copyBtn");
            btn.innerText = "Tersalin!";
            setTimeout(function() {
                btn.innerText = "Salin Script";
            }, 2000);
        }).catch(function(err) {
            textArea.select();
            document.execCommand("copy");
            var btn = document.getElementById("copyBtn");
            btn.innerText = "Tersalin!";
            setTimeout(function() {
                btn.innerText = "Salin Script";
            }, 2000);
        });
    }
</script>

</body>
</html>
