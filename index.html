<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta APK & Script Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 20px;
            text-align: center;
        }
        .btn-download {
            display: block;
            text-align: center;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin: 15px 0 25px 0;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #1d4ed8;
        }
        .code-box {
            position: relative;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
        }
        textarea {
            width: 100%;
            height: 70px;
            background: transparent;
            color: #38bdf8;
            border: none;
            resize: none;
            font-family: monospace;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }
        .btn-copy {
            width: 100%;
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Delta Executor & Script</h2>
    
    <!-- Tombol Download APK -->
    <a href="https://www.mediafire.com/file/dq20cidv8ykr3bu/Delta-2.735.1138.apk/file" target="_blank" class="btn-download">
        📥 Download Delta APK
    </a>

    <!-- Kotak Copy Paste Script -->
    <label style="font-size: 14px; font-weight: bold;">Script Auto Execute:</label>
    <div class="code-box">
        <textarea id="scriptText" readonly>loadstring(game:HttpGet("https://isnahamzah.site/SubscribeYTisnahamzah/NightMysticHub.lua"))()</textarea>
        <button class="btn-copy" onclick="copyScript()">📋 Salin Script</button>
    </div>
</div>

<script>
    function copyScript() {
        const text = document.getElementById("scriptText");
        text.select();
        text.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(text.value);
        alert("Script berhasil disalin!");
    }
</script>

</body>
</html>
