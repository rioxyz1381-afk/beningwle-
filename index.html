<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouroboros Script & Delta APK</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #2b2b3b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #89b4fa;
        }
        .code-box {
            background-color: #181825;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #45475a;
            font-family: monospace;
            word-break: break-all;
            margin-bottom: 15px;
            text-align: left;
            color: #a6e3a1;
        }
        button, .btn-download {
            display: inline-block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: 0.2s;
        }
        .btn-copy {
            background-color: #89b4fa;
            color: #11111b;
        }
        .btn-copy:hover {
            background-color: #b4befe;
        }
        .btn-download {
            background-color: #a6e3a1;
            color: #11111b;
        }
        .btn-download:hover {
            background-color: #94e2d5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ouroboros Script</h2>
    
    <div class="code-box" id="scriptText">
        loadstring(game:HttpGet("https://raw.githubusercontent.com/joustingmatch/Ouroboros/main/loader.lua"))()
    </div>

    <button class="btn-copy" onclick="copyScript()">Copy Script</button>
    
    <a href="https://www.mediafire.com/file/o7vhf0qgs5mxgzx/Delta-2.738.1397.apk/file?hash=ISOjmW5wS6rMoxV84kDIJ6ghhsQ4Ng2ZFLOFFWaDd3fLYQaU3DvO8VAEZxQRMPTr" target="_blank" class="btn-download">
        Download Delta APK
    </a>
</div>

<script>
    function copyScript() {
        const text = document.getElementById("scriptText").innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("Script berhasil disalin!");
        }).catch(err => {
            console.error("Gagal menyalin: ", err);
        });
    }
</script>

</body>
</html>
